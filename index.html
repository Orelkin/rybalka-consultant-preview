<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<body>
<div id="preview-loader" style="font-family:system-ui;padding:24px;color:#edf6ff;background:#04111d;min-height:100vh">Загрузка полной версии…</div>
<script>window.__APP_CHUNKS=new Array(11);</script>
<script src="bundle/chunk00.js?v=stage2-20260930b"></script><script src="bundle/chunk01.js?v=stage2-20260930b"></script><script src="bundle/chunk02.js?v=stage2-20260930b"></script><script src="bundle/chunk03.js?v=stage2-20260930b"></script><script src="bundle/chunk04.js?v=stage2-20260930b"></script><script src="bundle/chunk05.js?v=stage2-20260930b"></script><script src="bundle/chunk06.js?v=stage2-20260930b"></script><script src="bundle/chunk07.js?v=stage2-20260930b"></script><script src="bundle/chunk08.js?v=stage2-20260930b"></script><script src="bundle/chunk09.js?v=stage2-20260930b"></script><script src="bundle/chunk10.js?v=stage2-20260930b"></script>
<script>
(function(){
  const ok=window.__APP_CHUNKS.length===11 &&
    window.__APP_CHUNKS.every(x=>typeof x==='string'&&x.length>0);
  const html=ok?window.__APP_CHUNKS.join(''):'';
  if(!ok || html.length<6000000){
    document.getElementById('preview-loader').innerHTML=
      '<b>Preview не загрузился полностью.</b><br>Обновите страницу без кэша.';
    return;
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
